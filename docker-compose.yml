services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masterdata}
      POSTGRES_USER: ${POSTGRES_USER:-masteruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masteruser} -d ${POSTGRES_DB:-masterdata}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "7070:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
