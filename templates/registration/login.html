{% extends "base.html" %}
{% block title %}Login | RO{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:65vh"><div class="col-lg-5 col-md-7"><div class="card shadow-lg border-0 rounded-lg"><div class="card-header text-center py-4"><h3 class="fw-light my-2"><i class="fas fa-layer-group me-2"></i>RO Master Data</h3><div class="text-muted small">Silakan masuk ke akun Anda</div></div><div class="card-body p-4">
{% if form.errors %}<div class="alert alert-danger">Username atau password tidak sesuai.</div>{% endif %}
<form method="post">{% csrf_token %}
<div class="form-floating mb-3"><input class="form-control" id="id_username" name="username" type="text" placeholder="Username" autocomplete="username" required><label for="id_username">Username</label></div>
<div class="form-floating mb-3"><input class="form-control" id="id_password" name="password" type="password" placeholder="Password" autocomplete="current-password" required><label for="id_password">Password</label></div>
{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<button class="btn btn-primary w-100 py-2" type="submit">Login</button>
</form></div><div class="card-footer text-center py-3"><div class="small text-muted">Aplikasi Master Data RO</div></div></div></div></div>
{% endblock %}
